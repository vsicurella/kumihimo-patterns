<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kumihimo Patterns</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/a-color-picker@1.2.1/dist/acolorpicker.min.js "></script>
    <script src="./state.js"></script>
    <script src="./braid.js"></script>
    <script src="./controls.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        .container {
            display: flex;
            height: 95vh;
            gap: 20px;
            padding: 20px;
        }
        .pattern-preview {
            flex: 1;
            background-color: #f0f0f0;
            border-radius: 8px;
            max-width: 33%;
            max-height: 100%;
        }
        .controls {
            flex: 1;
            display: flex;
            flex-direction: row;
            gap: 20px;
            background-color: #f0f0f0;
            border-radius: 8px;
            padding: 20px;
        }
        .parameters {
            flex: 0 0 30%;
            /* display: flex; */
            flex-direction: column;
            gap: 10px;
        }
        .color-details {
            flex: 1;
            background-color: f0f0f0;
            border-radius: 8px;
            padding: 0;
        }
        .picker {
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="pattern-preview"></div>
        <div class="controls">
            <div class="parameters">
                <label for="pattern-select">Pattern:</label>
                <select id="pattern-select"></select>
                <br>
                <label for="num-threads-input"># Threads:</label>
                <input id="num-threads-input" type="number" min=8 max=32 step=2 value='16'/>
                <button id="move-left" onclick="app.rotateColorsCounterClockwise()">&lt;</button>
                <button id="move-right" onclick="app.rotateColorsClockwise()">&gt;</button>
                <br>
                <button id="paint-all" onclick="app.paintAllThreads()">Paint All</button>
                <input type="checkbox" onchange="app.toggleThreadNums()">Show Thread Nums
                <br>
                <div id="color-picker" class="picker"></div>
            </div>
            <div class="color-details"></div>
        </div>
    </div>
    <script src="./app.js"></script>
</body>
</html>

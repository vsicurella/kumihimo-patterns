<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kumihimo Patterns</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        .container {
            display: flex;
            height: 100vh;
            gap: 20px;
            padding: 20px;
        }
        .pattern-preview {
            flex: 1;
            background-color: #f0f0f0;
            border-radius: 8px;
        }
        .controls {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .pattern-details,
        .color-details {
            flex: 1;
            background-color: #f0f0f0;
            border-radius: 8px;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="pattern-preview"></div>
        <div class="controls">
            <div class="pattern-details"></div>
            <div class="color-details"></div>
        </div>
    </div>

<script src="app.js"></script>
</body>
</html>
